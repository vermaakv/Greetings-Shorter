name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Files uploaded through the github.com website lose the 'executable' flag.
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk GreetingSorter.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GreetingSorter-apk
          path: GreetingSorter.apk

      # On main, publish the APK to a "latest" release so it can be downloaded straight to a phone.
      - name: Publish to the "latest" release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --title "Greeting Sorter (latest build)" \
              --notes "Download GreetingSorter.apk on your Android phone and open it to install."
          gh release upload latest GreetingSorter.apk --clobber
